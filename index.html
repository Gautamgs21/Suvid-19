<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Folder Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Aptos Serif', 'Segoe UI', serif;
            font-weight: 600;
        }
        input, textarea, button, table {
            font-weight: 400;
        }
        label, h1, h2, th {
            font-weight: 600;
        }
        #toastContainer {
            transition: all 0.3s ease-in-out;
        }

        /* New loader animation */
        .loader {
         width: 60px;
         aspect-ratio: 1;
         background: 
            linear-gradient(45deg,#60B99A 50%,#0000 0),
            linear-gradient(45deg,#0000 50%,#60B99A 0),
            linear-gradient(-45deg,#f77825 50%,#0000 0),
            linear-gradient(-45deg,#0000 50%,#f77825 0),
            linear-gradient(#554236 0 0);
         background-size: 50% 50%;
         background-repeat: no-repeat;
         animation: l18 1.5s infinite;
        }
        @keyframes l18{
         0%   {background-position:50% 50%,50% 50%,50%  50% ,50% 50%,50% 50%}
         25%  {background-position:0  100%,100%  0,50%  50% ,50% 50%,50% 50%}
         50%  {background-position:0  100%,100%  0,100% 100%,0   0  ,50% 50%}
         75%  {background-position:50% 50%,50% 50%,100% 100%,0   0  ,50% 50%}
         100% {background-position:50% 50%,50% 50%,50%  50% ,50% 50%,50% 50%}
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative overflow-x-hidden text-sm sm:text-base lg:text-lg">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none max-w-[90vw]"></div>

    <!-- Custom Web App Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="font-bold text-slate-800 text-lg sm:text-xl" id="modalTitle">Confirm Action</h3>
            <p class="text-slate-600 text-sm sm:text-base" id="modalMessage">Are you sure you want to proceed?</p>
            <div class="flex justify-end gap-3 pt-2">
                <button id="modalCancelBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold transition text-sm sm:text-base">Cancel</button>
                <button id="modalConfirmBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition text-sm sm:text-base">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Custom Input Prompt Modal for Renaming -->
    <div id="promptModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="font-bold text-slate-800 text-lg sm:text-xl" id="promptTitle">Edit Folder Name</h3>
            <input type="text" id="promptInput" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm sm:text-base">
            <div class="flex justify-end gap-3 pt-2">
                <button id="promptCancelBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold transition text-sm sm:text-base">Cancel</button>
                <button id="promptConfirmBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition text-sm sm:text-base">Save</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex justify-between items-center">
            <h1 class="text-xl sm:text-2xl lg:text-3xl tracking-wide">Work Folder Management System</h1>
        </div>
    </header>

    <!-- Main Container: Differentiates Mobile vs Computer Layouts -->
    <main class="max-w-7xl mx-auto px-2 sm:px-4 py-4 sm:py-6 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 w-full">
        
        <!-- Left Column: Create Work Form (Span 4 on Desktop, Full on Mobile) -->
        <div class="lg:col-span-4 flex flex-col gap-4 sm:gap-6">
            
            <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-slate-700 text-base sm:text-lg lg:text-xl border-b pb-2 sm:pb-3 mb-3 sm:mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 text-blue-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Create Work Entry
                </h2>
                <form id="workForm" class="space-y-3 sm:space-y-4">
                    <div>
                        <label class="block uppercase text-slate-500 text-xs sm:text-sm mb-1">Date of Entry</label>
                        <input type="date" id="entryDate" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm sm:text-base">
                    </div>
                    <div>
                        <label class="block uppercase text-slate-500 text-xs sm:text-sm mb-1">Name of the Folder / Work</label>
                        <input type="text" id="workName" placeholder="e.g., SUC Assessment - Bharti Airtel" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm sm:text-base">
                    </div>
                    <div>
                        <label class="block uppercase text-slate-500 text-xs sm:text-sm mb-1">Remarks</label>
                        <textarea id="workRemarks" rows="3" placeholder="Enter remarks details..." 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-sm sm:text-base"></textarea>
                    </div>
                    <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg transition shadow-sm font-semibold text-sm sm:text-base">
                        Create New Entry
                    </button>
                </form>
            </div>

        </div>

        <!-- Right Column: Details of Works Table (Span 8 on Desktop, Full on Mobile) -->
        <div class="lg:col-span-8 flex flex-col gap-4 min-w-0">
            <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col min-w-0">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-3 sm:pb-4 border-b gap-3 sm:gap-4">
                    <h2 class="text-slate-700 text-base sm:text-lg lg:text-xl">Details of Works</h2>
                    
                    <!-- Action Bar with Table Search Box -->
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto justify-start sm:justify-end">
                        <div class="relative w-full sm:w-auto">
                            <input type="text" id="tableSearchInput" placeholder="Filter table results..." 
                                class="pl-8 pr-3 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-56 text-sm sm:text-base">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto justify-end">
                            <button id="refreshBtn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold transition shrink-0 text-sm sm:text-base">
                                Refresh
                            </button>
                            <button id="deleteBtn" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-semibold transition shrink-0 text-sm sm:text-base">
                                Delete Selected
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="overflow-x-auto flex-grow mt-3 sm:mt-4 relative min-h-[250px] sm:min-h-[300px] w-full">
                    <!-- Loading Overlay with New Loader Animation + Real-Time Percentage -->
                    <div id="loadingOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center gap-3 transition-opacity duration-300">
                        <div class="relative flex items-center justify-center">
                            <div class="loader"></div>
                            <span id="loadingPercentage" class="absolute font-bold text-white drop-shadow text-xs">0%</span>
                        </div>
                        <span id="loadingStatusText" class="font-semibold text-slate-600 text-center px-4 text-sm sm:text-base">Loading from Database...</span>
                    </div>

                    <table class="w-full text-left border-collapse min-w-[500px] text-sm sm:text-base">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase tracking-wider text-xs sm:text-sm">
                                <th class="p-2.5 sm:p-3 w-10 text-center"><input type="checkbox" id="selectAll" class="rounded"></th>
                                <th class="p-2.5 sm:p-3 w-14">Sl No</th>
                                <th class="p-2.5 sm:p-3">Name of the Work</th>
                                <th class="p-2.5 sm:p-3 w-32">Date of Entry</th>
                                <th class="p-2.5 sm:p-3 w-28 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="workTableBody" class="divide-y divide-slate-200">
                            <!-- Dynamic rows will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Container -->
                <div id="paginationContainer" class="flex flex-col sm:flex-row justify-between items-center pt-3 sm:pt-4 border-t mt-3 sm:mt-4 gap-3 text-slate-600 text-sm sm:text-base">
                    <span id="paginationInfo">Showing 0-0 of 0 entries</span>
                    <div class="flex gap-2 w-full sm:w-auto justify-between sm:justify-end">
                        <button id="prevPageBtn" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold disabled:opacity-50 flex-1 sm:flex-initial text-center" disabled>Previous</button>
                        <button id="nextPageBtn" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg font-semibold disabled:opacity-50 flex-1 sm:flex-initial text-center" disabled>Next</button>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-white border-t py-3 text-center text-slate-400 px-4 text-xs sm:text-sm">
        GitHub Pages Frontend Connected to Apps Script
    </footer>
    
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUvgiK-Iih8Vgh5F8-e7HiXAJHszCzFDNzwS9xMH9tS0EJBh4hJVH99jpsyajPUJZc/exec";
        const DEFAULT_FOLDER_ID = "1vmeGBBB1qEdHqdPxMU4OHMEIJbsKIzRt";

        let allTableData = [];
        let currentPage = 1;
        const rowsPerPage = 20;

        // Helper function to convert YYYY-MM-DD to DD-MM-YYYY for display
        function formatDateForDisplay(dateStr) {
            if (!dateStr) return '';
            let cleanStr = dateStr.includes('T') ? dateStr.split('T')[0] : dateStr;
            let parts = cleanStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return cleanStr;
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${bgClass} text-white px-4 py-2.5 sm:px-5 sm:py-3 rounded-xl shadow-lg pointer-events-auto flex items-center justify-between gap-4 transition-all duration-300 opacity-0 translate-y-2 text-sm sm:text-base`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Custom Confirmation Modal
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modal.classList.remove('hidden');

            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            const cleanUp = () => {
                modal.classList.add('hidden');
                confirmBtn.replaceWith(confirmBtn.cloneNode(true));
                cancelBtn.replaceWith(cancelBtn.cloneNode(true));
            };

            document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                cleanUp();
                onConfirm();
            });
            document.getElementById('modalCancelBtn').addEventListener('click', cleanUp);
        }

        // Custom Prompt Modal for Renaming/Editing
        function showPromptModal(title, defaultValue, onSave) {
            const modal = document.getElementById('promptModal');
            document.getElementById('promptTitle').textContent = title;
            const input = document.getElementById('promptInput');
            input.value = defaultValue;
            modal.classList.remove('hidden');
            input.focus();

            const confirmBtn = document.getElementById('promptConfirmBtn');
            const cancelBtn = document.getElementById('promptCancelBtn');

            const cleanUp = () => {
                modal.classList.add('hidden');
                confirmBtn.replaceWith(confirmBtn.cloneNode(true));
                cancelBtn.replaceWith(cancelBtn.cloneNode(true));
            };

            document.getElementById('promptConfirmBtn').addEventListener('click', () => {
                const val = input.value.trim();
                cleanUp();
                if (val) onSave(val);
            });
            document.getElementById('promptCancelBtn').addEventListener('click', cleanUp);
        }

        // Smooth Percentage Progress Animation Controllers
        let progressInterval = null;
        function startLoading(statusMessage) {
            const overlay = document.getElementById('loadingOverlay');
            const percentageText = document.getElementById('loadingPercentage');
            const statusText = document.getElementById('loadingStatusText');
            
            overlay.classList.remove('hidden', 'opacity-0');
            statusText.textContent = statusMessage;
            
            let currentPercent = 20;
            percentageText.textContent = currentPercent + '%';

            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (currentPercent < 95) {
                    currentPercent += Math.floor(Math.random() * 10) + 5;
                    if (currentPercent > 95) currentPercent = 95;
                    percentageText.textContent = currentPercent + '%';
                }
            }, 100);
        }

        function stopLoading(onComplete) {
            if (progressInterval) clearInterval(progressInterval);
            const overlay = document.getElementById('loadingOverlay');
            const percentageText = document.getElementById('loadingPercentage');
            const statusText = document.getElementById('loadingStatusText');

            percentageText.textContent = '100%';
            statusText.textContent = 'Complete!';

            setTimeout(() => {
                overlay.classList.add('opacity-0');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    if (onComplete) onComplete();
                }, 200);
            }, 200);
        }

        // Render Table Data with Pagination
        function renderTable(dataToRender) {
            const tbody = document.getElementById('workTableBody');
            tbody.innerHTML = '';
            
            if (!dataToRender || dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No entries found.</td></tr>`;
                document.getElementById('paginationInfo').textContent = 'Showing 0-0 of 0 entries';
                document.getElementById('prevPageBtn').disabled = true;
                document.getElementById('nextPageBtn').disabled = true;
                return;
            }

            const totalPages = Math.ceil(dataToRender.length / rowsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * rowsPerPage;
            const endIdx = startIdx + rowsPerPage;
            const paginatedData = dataToRender.slice(startIdx, endIdx);

            paginatedData.forEach((row, index) => {
                const actualIndex = startIdx + index + 1;
                const displayDate = formatDateForDisplay(row.entryDate);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50';
                tr.innerHTML = `
                    <td class="p-2.5 sm:p-3 text-center"><input type="checkbox" class="row-select" data-folder-id="${row.folderId}"></td>
                    <td class="p-2.5 sm:p-3 text-slate-500">${actualIndex}</td>
                    <td class="p-2.5 sm:p-3 text-slate-800 break-words">${row.workName}</td>
                    <td class="p-2.5 sm:p-3 text-slate-600 whitespace-nowrap">${displayDate}</td>
                    <td class="p-2.5 sm:p-3 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <!-- Open Folder Icon -->
                            <a href="${row.folderUrl}" target="_blank" title="Open Folder in Drive" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                            </a>
                            <!-- Edit/Rename Folder Icon -->
                            <button onclick="editFolder('${row.folderId}', '${row.workName.replace(/'/g, "\\'")}')" title="Rename Folder" class="p-1.5 text-amber-600 hover:bg-amber-50 rounded-lg transition">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <!-- Delete Folder Icon -->
                            <button onclick="deleteSingleFolder('${row.folderId}')" title="Delete Folder" class="p-1.5 text-red-600 hover:bg-red-50 rounded-lg transition">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('paginationInfo').textContent = `Showing ${startIdx + 1}-${Math.min(endIdx, dataToRender.length)} of ${dataToRender.length} entries`;
            document.getElementById('prevPageBtn').disabled = currentPage === 1;
            document.getElementById('nextPageBtn').disabled = currentPage === totalPages || totalPages === 0;
        }

        // Filter functionality for table search box (supports searching by formatted DD-MM-YYYY or work name)
        document.getElementById('tableSearchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filteredData = allTableData.filter(row => {
                const displayDate = formatDateForDisplay(row.entryDate).toLowerCase();
                return row.workName.toLowerCase().includes(term) || displayDate.includes(term);
            });
            currentPage = 1;
            renderTable(filteredData);
        });

        // Pagination Button Handlers
        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                const term = document.getElementById('tableSearchInput').value.toLowerCase();
                const filteredData = allTableData.filter(row => {
                    const displayDate = formatDateForDisplay(row.entryDate).toLowerCase();
                    return row.workName.toLowerCase().includes(term) || displayDate.includes(term);
                });
                renderTable(filteredData);
            }
        });

        document.getElementById('nextPageBtn').addEventListener('click', () => {
            const term = document.getElementById('tableSearchInput').value.toLowerCase();
            const filteredData = allTableData.filter(row => {
                const displayDate = formatDateForDisplay(row.entryDate).toLowerCase();
                return row.workName.toLowerCase().includes(term) || displayDate.includes(term);
            });
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable(filteredData);
            }
        });

        // Select All Checkbox Handler
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.row-select');
            checkboxes.forEach(cb => cb.checked = this.checked);
        });

        // Load table data with Client-Side localStorage Caching for instant render
        window.loadTableData = function() {
            const cachedData = localStorage.getItem('workFolderCache');
            if (cachedData) {
                try {
                    allTableData = JSON.parse(cachedData);
                    renderTable(allTableData);
                    document.getElementById('loadingOverlay').classList.add('opacity-0');
                    setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 200);
                } catch (e) {
                    startLoading('Loading from Database...');
                }
            } else {
                startLoading('Loading from Database...');
            }

            const oldScript = document.getElementById('jsonpScript');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonpScript';
            script.src = `${SCRIPT_URL}?callback=handleTableData`;
            document.body.appendChild(script);
        };

        window.handleTableData = function(data) {
            stopLoading(() => {
                if (!data || data.length === 0) {
                    allTableData = [];
                    localStorage.removeItem('workFolderCache');
                    renderTable([]);
                    return;
                }

                data.sort((a, b) => {
                    let dateA = a.entryDate ? a.entryDate.replace(/-/g, '') : '';
                    let dateB = b.entryDate ? b.entryDate.replace(/-/g, '') : '';
                    return dateB.localeCompare(dateA);
                });

                allTableData = data;
                localStorage.setItem('workFolderCache', JSON.stringify(data));
                renderTable(allTableData);
            });
        };

        // Edit / Rename Folder Action Handler
        window.editFolder = function(folderId, currentName) {
            showPromptModal('Rename Work Folder', currentName, (newName) => {
                startLoading('Renaming folder...');
                const renameScript = document.createElement('script');
                renameScript.src = `${SCRIPT_URL}?action=rename&folderId=${folderId}&newName=${encodeURIComponent(newName)}&callback=renameDone`;
                document.body.appendChild(renameScript);
            });
        };

        window.renameDone = function(res) {
            stopLoading(() => {
                showToast('Folder renamed successfully!', 'success');
                setTimeout(window.loadTableData, 300);
            });
        };

        // Delete Single Folder Action Handler
        window.deleteSingleFolder = function(folderId) {
            showConfirmModal('Delete Entry', 'Are you sure you want to delete this folder?', () => {
                startLoading('Deleting folder...');
                const delScript = document.createElement('script');
                delScript.src = `${SCRIPT_URL}?action=delete&folderId=${folderId}&callback=singleDeleteDone`;
                document.body.appendChild(delScript);
            });
        };

        window.singleDeleteDone = function(res) {
            stopLoading(() => {
                showToast('Folder deleted successfully!', 'success');
                setTimeout(window.loadTableData, 300);
            });
        };

        document.getElementById('refreshBtn').addEventListener('click', window.loadTableData);

        // Delete Selected Folders Handler
        document.getElementById('deleteBtn').addEventListener('click', function() {
            const selectedCheckboxes = document.querySelectorAll('.row-select:checked');
            if (selectedCheckboxes.length === 0) {
                showToast('Please select at least one entry to delete.', 'error');
                return;
            }

            showConfirmModal(
                'Delete Entries',
                `Are you sure you want to delete ${selectedCheckboxes.length} selected folder(s)?`,
                () => {
                    startLoading('Deleting selected folders...');
                    let folderIds = Array.from(selectedCheckboxes).map(cb => cb.getAttribute('data-folder-id'));
                    
                    let index = 0;
                    function deleteNext() {
                        if (index >= folderIds.length) {
                            stopLoading(() => {
                                showToast('Selected folders deleted successfully!', 'success');
                                document.getElementById('selectAll').checked = false;
                                setTimeout(window.loadTableData, 300);
                            });
                            return;
                        }

                        let currentId = folderIds[index++];
                        let delScript = document.createElement('script');
                        delScript.src = `${SCRIPT_URL}?action=delete&folderId=${currentId}&callback=deleteDone`;
                        document.body.appendChild(delScript);
                    }

                    window.deleteDone = function(res) {
                        deleteNext();
                    };

                    deleteNext();
                }
            );
        });

        // Handle Form Submission
        document.getElementById('workForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            startLoading('Creating Drive Folder & Remarks...');

            const payload = {
                entryDate: document.getElementById('entryDate').value,
                workName: document.getElementById('workName').value,
                remarks: document.getElementById('workRemarks').value,
                defaultFolderId: DEFAULT_FOLDER_ID
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                stopLoading(() => {
                    showToast('Entry Created Successfully!', 'success');
                    document.getElementById('workForm').reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create New Entry';
                    setTimeout(window.loadTableData, 500);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                stopLoading(() => {
                    showToast('Error creating entry.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create New Entry';
                });
            });
        });

        // Load data automatically when page opens
        window.onload = window.loadTableData;
    </script>
</body>
</html>
