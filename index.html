<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Folder Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Aptos Display', 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 22px;
        }
        input, textarea, button, table {
            font-weight: 400;
        }
        label, h1, h2, th {
            font-weight: 600;
        }
        /* Toast Animation */
        #toastContainer {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-xl font-bold text-slate-800" id="modalTitle">Confirm Action</h3>
            <p class="text-base text-slate-600" id="modalMessage">Are you sure you want to proceed?</p>
            <div class="flex justify-end gap-3 pt-2">
                <button id="modalCancelBtn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-base font-semibold transition">Cancel</button>
                <button id="modalConfirmBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-base font-semibold transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl tracking-wide">Work Folder Management System</h1>
            <!-- Global Search Bar -->
            <div class="relative w-full sm:w-80">
                <input type="text" id="globalSearchInput" placeholder="Search works or dates..." 
                    class="w-full pl-10 pr-4 py-2 rounded-lg text-slate-800 bg-white/90 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-400 text-lg">
                <svg class="w-5 h-5 text-slate-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6 w-full">
        
        <!-- Left Column: Create Work Form & Settings -->
        <div class="lg:col-span-1 flex flex-col gap-6">
            
            <!-- Create Work Card -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl text-slate-700 border-b pb-3 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Create Work Entry
                </h2>
                <form id="workForm" class="space-y-4">
                    <div>
                        <label class="block text-base uppercase text-slate-500 mb-1">Date of Entry</label>
                        <input type="date" id="entryDate" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
                    </div>
                    <div>
                        <label class="block text-base uppercase text-slate-500 mb-1">Name of the Folder / Work</label>
                        <input type="text" id="workName" placeholder="e.g., SUC Assessment - Bharti Airtel" required 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg">
                    </div>
                    <div>
                        <label class="block text-base uppercase text-slate-500 mb-1">Remarks</label>
                        <textarea id="workRemarks" rows="3" placeholder="Enter remarks details..." 
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg resize-none"></textarea>
                    </div>
                    <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg transition text-lg shadow-sm font-semibold">
                        Create New Entry
                    </button>
                </form>
            </div>

            <!-- Settings Card -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xl text-slate-700 border-b pb-3 mb-4">Settings</h2>
                <div class="text-slate-600 text-base">
                    <p class="font-semibold">Target Drive Folder:</p>
                    <p class="text-sm text-slate-500 break-all mt-1">Work_DataBase (ID: 1vmeGBBB1qEdHqdPxMU4OHMEIJbsKIzRt)</p>
                </div>
            </div>

        </div>

        <!-- Right Column: Details of Works Table -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col">
                
                <div class="flex flex-col sm:flex-row justify-between items-center pb-4 border-b gap-4">
                    <h2 class="text-xl text-slate-700">Details of Works</h2>
                    
                    <!-- Action Bar with Table Search Box right before Refresh -->
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <div class="relative">
                            <input type="text" id="tableSearchInput" placeholder="Filter table results..." 
                                class="pl-8 pr-3 py-1.5 border border-slate-300 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-52 sm:w-64">
                            <svg class="w-5 h-5 text-slate-400 absolute left-2.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                        <button id="refreshBtn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-base font-semibold transition shrink-0">
                            Refresh
                        </button>
                        <button id="deleteBtn" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-base font-semibold transition shrink-0">
                            Delete Selected
                        </button>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="overflow-x-auto flex-grow mt-4">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-base uppercase tracking-wider">
                                <th class="p-3 w-10 text-center"><input type="checkbox" id="selectAll" class="rounded"></th>
                                <th class="p-3 w-16">Sl No</th>
                                <th class="p-3">Name of the Work</th>
                                <th class="p-3 w-40">Date of Entry</th>
                                <th class="p-3 w-36 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="workTableBody" class="divide-y divide-slate-200 text-lg">
                            <!-- Dynamic rows will be loaded here -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

    <footer class="bg-white border-t py-3 text-center text-base text-slate-400">
        GitHub Pages Frontend Connected to Apps Script
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUvgiK-Iih8Vgh5F8-e7HiXAJHszCzFDNzwS9xMH9tS0EJBh4hJVH99jpsyajPUJZc/exec";
        const DEFAULT_FOLDER_ID = "1vmeGBBB1qEdHqdPxMU4OHMEIJbsKIzRt";

        // Modern Toast Notification Function
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let bgClass = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            toast.className = `${bgClass} text-white px-5 py-3 rounded-xl shadow-lg pointer-events-auto flex items-center justify-between gap-4 text-base transition-all duration-300 opacity-0 translate-y-2`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Custom Modal Confirmation Helper
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');

            const cleanUp = () => {
                modal.classList.add('hidden');
                confirmBtn.replaceWith(confirmBtn.cloneNode(true));
                cancelBtn.replaceWith(cancelBtn.cloneNode(true));
            };

            document.getElementById('modalConfirmBtn').addEventListener('click', () => {
                cleanUp();
                onConfirm();
            });

            document.getElementById('modalCancelBtn').addEventListener('click', cleanUp);
        }

        // Filter functionality
        const filterFunction = (e) => {
            const term = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#workTableBody tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        };

        document.getElementById('tableSearchInput').addEventListener('input', filterFunction);
        document.getElementById('globalSearchInput').addEventListener('input', function(e) {
            document.getElementById('tableSearchInput').value = e.target.value;
            filterFunction(e);
        });

        // Select All Checkbox Handler
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.row-select');
            checkboxes.forEach(cb => cb.checked = this.checked);
        });

        // Load table data using JSONP
        window.loadTableData = function() {
            const tbody = document.getElementById('workTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">Loading entries...</td></tr>`;

            const oldScript = document.getElementById('jsonpScript');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'jsonpScript';
            script.src = `${SCRIPT_URL}?callback=handleTableData`;
            document.body.appendChild(script);
        };

        window.handleTableData = function(data) {
            const tbody = document.getElementById('workTableBody');
            tbody.innerHTML = '';
            
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No entries found.</td></tr>`;
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50';
                tr.innerHTML = `
                    <td class="p-3 text-center"><input type="checkbox" class="row-select" data-folder-id="${row.folderId}"></td>
                    <td class="p-3 text-slate-500">${index + 1}</td>
                    <td class="p-3 text-slate-800">${row.workName}</td>
                    <td class="p-3 text-slate-600">${row.entryDate}</td>
                    <td class="p-3 text-center">
                        <a href="${row.folderUrl}" target="_blank" class="text-blue-600 hover:underline text-base font-semibold">Open Folder</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        document.getElementById('refreshBtn').addEventListener('click', window.loadTableData);

        // Delete Selected Folders via Custom Modal & Toast
        document.getElementById('deleteBtn').addEventListener('click', function() {
            const selectedCheckboxes = document.querySelectorAll('.row-select:checked');
            if (selectedCheckboxes.length === 0) {
                showToast('Please select at least one entry to delete.', 'error');
                return;
            }

            showConfirmModal(
                'Delete Entries',
                `Are you sure you want to delete ${selectedCheckboxes.length} selected folder(s)?`,
                () => {
                    const deleteBtn = document.getElementById('deleteBtn');
                    deleteBtn.disabled = true;
                    deleteBtn.textContent = 'Deleting...';

                    let folderIds = Array.from(selectedCheckboxes).map(cb => cb.getAttribute('data-folder-id'));
                    
                    let index = 0;
                    function deleteNext() {
                        if (index >= folderIds.length) {
                            showToast('Selected folders deleted successfully!', 'success');
                            deleteBtn.disabled = false;
                            deleteBtn.textContent = 'Delete Selected';
                            document.getElementById('selectAll').checked = false;
                            setTimeout(window.loadTableData, 1000);
                            return;
                        }

                        let currentId = folderIds[index++];
                        let delScript = document.createElement('script');
                        delScript.src = `${SCRIPT_URL}?action=delete&folderId=${currentId}&callback=deleteDone`;
                        document.body.appendChild(delScript);
                    }

                    window.deleteDone = function(res) {
                        deleteNext();
                    };

                    deleteNext();
                }
            );
        });

        // Handle Form Submission with Toasts
        document.getElementById('workForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            const payload = {
                entryDate: document.getElementById('entryDate').value,
                workName: document.getElementById('workName').value,
                remarks: document.getElementById('workRemarks').value,
                defaultFolderId: DEFAULT_FOLDER_ID
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                showToast('Entry Created Successfully!', 'success');
                document.getElementById('workForm').reset();
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create New Entry';
                setTimeout(window.loadTableData, 1500);
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('Error creating entry.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create New Entry';
            });
        });

        // Load data automatically when page opens
        window.onload = window.loadTableData;
    </script>
</body>
</html>
